<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido da equipe</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    #catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    .cartao { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; text-align: center; }
    .cartao .imagem { font-size: 3rem; }
    .resumo { margin-top: 2rem; padding: 1rem; background: #f3f6fb; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Pedido da equipe</h1>
  <div id="catalogo"></div>

  <div class="resumo">
    <p>Itens no pedido: <strong id="qtd">0</strong></p>
    <p>Subtotal: <strong id="subtotal">R$ 0,00</strong></p>
    <p>Desconto: <strong id="desconto">R$ 0,00</strong></p>
    <p>Total: <strong id="total">R$ 0,00</strong></p>
  </div>

  <script>
    // PASSO 1 - Modelar os dados: array de objetos (troque pelos itens da equipe)
    const catalogo = [
      { id: 1, nome: "Item A", preco: 25.9, imagem: "🍔" },
      { id: 2, nome: "Item B", preco: 12.5, imagem: "🍟" },
      { id: 3, nome: "Item C", preco: 8.0,  imagem: "🥤" },
      { id: 4, nome: "Item D", preco: 18.75, imagem: "🍕" },
      { id: 5, nome: "Item E", preco: 15.0, imagem: "🍰" }
    ];

    // Estado do pedido: guarda quantas unidades de cada item (id -> quantidade)
    const pedido = {};

    // Regra do desconto: 10% quando o subtotal passa de R$ 100
    const LIMITE_DESCONTO = 100;
    const PERCENTUAL_DESCONTO = 0.10;

    const formatarMoeda = (valor) =>
      valor.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    // PASSO 2 - Criar os cartões: uma função monta UM cartão a partir de UM objeto
    function criarCartao(item) {
      const cartao = document.createElement("div");
      cartao.className = "cartao";
      cartao.innerHTML = `
        <div class="imagem">${item.imagem}</div>
        <h3>${item.nome}</h3>
        <p>${formatarMoeda(item.preco)}</p>
        <button data-id="${item.id}">Adicionar</button>
      `;
      cartao.querySelector("button").addEventListener("click", () => adicionar(item.id));
      return cartao;
    }

    function renderizarCatalogo() {
      const container = document.getElementById("catalogo");
      catalogo.forEach((item) => container.appendChild(criarCartao(item)));
    }

    // PASSO 3 - Somar o pedido: atualiza quantidade e total formatado
    function adicionar(id) {
      pedido[id] = (pedido[id] || 0) + 1;
      atualizarResumo();
    }

    function atualizarResumo() {
      let qtd = 0;
      let subtotal = 0;
      catalogo.forEach((item) => {
        const q = pedido[item.id] || 0;
        qtd += q;
        subtotal += q * item.preco;
      });

      const desconto = subtotal > LIMITE_DESCONTO ? subtotal * PERCENTUAL_DESCONTO : 0;

      document.getElementById("qtd").textContent = qtd;
      document.getElementById("subtotal").textContent = formatarMoeda(subtotal);
      document.getElementById("desconto").textContent = formatarMoeda(desconto);
      document.getElementById("total").textContent = formatarMoeda(subtotal - desconto);
    }

    renderizarCatalogo();
  </script>
</body>
</html>
